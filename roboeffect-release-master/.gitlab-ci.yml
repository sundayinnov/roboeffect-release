image: castle6610/andes_build_tools_v323:latest

stages:
  - build
  - release



build_job:
  stage: build
  script:
    - echo "build job"
    - PATH=/Andes/toolchains/nds32le-elf-mculib-v3s/bin:$PATH
    - PATH=/Andes/toolchains/nds32le-elf-mculib-v3s/nds32le-elf/bin:$PATH
    - PATH=/Andes/utils:$PATH
    - chmod 775 ./build.sh 
    - ./build.sh build
    - python3 ./tools/mva_maker.py -i ./cmake_build/roboeffect_demo.bin -o ./cmake_build/roboeffect_demo.mva

  artifacts:
      paths:
        - ./cmake_build/*

release_job:
  stage: release
  script:
    - echo "do release job"

  artifacts:
    paths:
      - ./cmake_build/*
